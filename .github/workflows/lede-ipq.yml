name: 🌿 LEDE IPQ Build (50xx/53xx/60xx/807x/95xx/806x)

# 每周一、周四 07:00 (北京时间) 自动编译 = UTC 周日/周三 23:00
on:
  schedule:
    - cron: '0 23 * * 0,3'
  workflow_dispatch:
    inputs:
      groups:
        description: '1、编译哪些芯片（QUALCOMMAX=807x+60xx+50xx）'
        required: false
        default: 'QUALCOMMAX'
        type: choice
        options:
          - 'QUALCOMMAX'
          - 'ALL'
          - 'IPQ807X'
          - 'IPQ60XX'
          - 'IPQ50XX'
          - 'IPQ95XX'
          - 'IPQ53XX'
          - 'IPQ806X'
      packages:
        description: '2、额外固件包（空格分隔，默认已含 LuCI 中文界面）'
        required: false
        default: 'luci luci-compat luci-i18n-base-zh-cn'
      make_release:
        description: '3、是否发布到 Release（只新增，绝不删除历史 release）'
        required: false
        default: true
        type: boolean

concurrency:
  group: lede-ipq-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 1：解析机型清单（直接从各 target 的 image/*.mk 拉取 TARGET_DEVICES）
  # ============================================================
  prepare:
    name: 🧭 机型清单
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Checkout (仅取各 target 的 image 定义)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            target/linux/qualcommax/image
            target/linux/qualcommbe/image
            target/linux/ipq806x/image
          sparse-checkout-cone-mode: false

      - name: 解析并生成清单
        id: plan
        env:
          GROUPS: ${{ inputs.groups || 'QUALCOMMAX' }}
        run: |
          python3 - <<'PY'
          import os, re, json

          # 组 -> [(target, subtarget, image mk 路径), ...]
          # 机型全部从 mk 文件的 TARGET_DEVICES 列表动态拉取
          GROUPS_DEF = {
              "IPQ807X": [("qualcommax", "ipq807x", "target/linux/qualcommax/image/ipq807x.mk")],
              "IPQ60XX": [("qualcommax", "ipq60xx", "target/linux/qualcommax/image/ipq60xx.mk")],
              "IPQ50XX": [("qualcommax", "ipq50xx", "target/linux/qualcommax/image/ipq50xx.mk")],
              "IPQ95XX": [("qualcommbe", "ipq95xx", "target/linux/qualcommbe/image/ipq95xx.mk")],
              "IPQ53XX": [("qualcommbe", "ipq53xx", "target/linux/qualcommbe/image/ipq53xx.mk")],
              # IPQ40XX 整组不纳入（用户要求：不编 ipq40xx 任何机型）
              "IPQ806X": [("ipq806x", "generic", "target/linux/ipq806x/image/generic.mk")],
          }
          ALIASES = {
              "QUALCOMMAX": ["IPQ807X", "IPQ60XX", "IPQ50XX"],
              "ALL": sorted(GROUPS_DEF),
          }

          want_sel = os.environ.get("GROUPS", "QUALCOMMAX").strip() or "QUALCOMMAX"
          groups = ALIASES.get(want_sel, [want_sel])
          unknown = [g for g in groups if g not in GROUPS_DEF]
          if unknown:
              print("::error::未知芯片组: %s（可选: %s）" % (" ".join(unknown), " ".join(sorted(GROUPS_DEF))))
              raise SystemExit(1)

          def devices_from_mk(path):
              """从 mk 文件的 TARGET_DEVICES += 行收集机型名"""
              devs = []
              for line in open(path, encoding="utf-8", errors="replace"):
                  if "TARGET_DEVICES" in line and "+=" in line:
                      for tok in re.split(r"[\s\\]+", line.split("+=", 1)[1]):
                          tok = tok.strip()
                          if tok and re.fullmatch(r"[A-Za-z0-9_.\-]+", tok):
                              devs.append(tok)
              return devs

          os.makedirs("plan", exist_ok=True)
          matrix, rows = [], []
          total = 0
          for g in groups:
              # OpenWrt 一次编译只能选一个 subtarget（TARGET_<t>_<sub> 是 choice，
              # 写两个会互相覆盖），所以每个 subtarget 独立一个编译 job
              subs = []
              for t, s, mk in GROUPS_DEF[g]:
                  if not os.path.exists(mk):
                      print("::error::找不到 %s —— 检查 sparse-checkout 是否漏了该目录，或当前 commit 里源码树是否完整" % mk)
                      for root in ("target/linux", "target"):
                          if os.path.isdir(root):
                              print("已检出的 %s: %s" % (root, sorted(os.listdir(root))))
                              break
                      else:
                          print("仓库根目录内容: %s" % sorted(os.listdir(".")))
                      raise SystemExit(1)
                  devs = sorted(set(devices_from_mk(mk)))
                  if not devs:
                      print("::error::%s 没解析到任何机型" % mk)
                      raise SystemExit(1)
                  fname = "%s__%s.txt" % (g, s)
                  with open(os.path.join("plan", fname), "w") as f:
                      f.write("\n".join(devs) + "\n")
                  subs.append({"target": t, "sub": s, "file": fname, "count": len(devs)})
                  print("%s/%s: %d 台" % (t, s, len(devs)))
              total += sum(s["count"] for s in subs)
              # 组内只有 1 个 subtarget 时沿用原组名；多个时按 subtarget 拆分命名
              if len(subs) == 1:
                  entries = [(g, subs)]
              else:
                  entries = [("%s-%s" % (g, s["sub"]), [s]) for s in subs]
              for gname, ss in entries:
                  cnt = sum(s["count"] for s in ss)
                  matrix.append({
                      "group": gname,
                      "target": ss[0]["target"],
                      "subs": json.dumps([s["sub"] for s in ss]),
                      "files": json.dumps([s["file"] for s in ss]),
                      "count": cnt,
                  })
                  rows.append((gname, cnt, [s["sub"] for s in ss]))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=%s\n" % json.dumps(matrix, separators=(",", ":")))
              f.write("total=%d\n" % total)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 🧭 机型清单（选择: %s）\n\n" % want_sel)
              f.write("| 组 | 台数 | subtarget |\n|---|---|---|\n")
              for g, n, subs in rows:
                  f.write("| %s | %d | %s |\n" % (g, n, ", ".join(subs)))
          PY

      - name: 上传清单
        uses: actions/upload-artifact@v4
        with:
          name: device-plan
          path: plan/
          retention-days: 3

  # ============================================================
  # Job 2：按芯片组编译（每个 subtarget 一次内核编译，产出其全部机型）
  # ============================================================
  build:
    name: 🏗️ ${{ matrix.group }} (${{ matrix.count }} 台)
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]' && needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          # 大型预装组件：dotnet/android/ghc/CodeQL/boost/node/jvm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd 2>/dev/null || true
          # Docker 镜像与容器层（编译用不到，可释放 6-10GB）
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          # apt 缓存与用户缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          # 系统日志与崩溃转储
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true

      - name: 下载清单
        uses: actions/download-artifact@v4
        with:
          name: device-plan
          path: plan

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lede-ipq-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            ccache-lede-ipq-${{ matrix.group }}-
            ccache-

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi

          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

      - name: 生成 .config（多机型 + 自动规避 feeds 的 Kconfig 递归依赖）
        env:
          TARGET: ${{ matrix.target }}
          SUBS: ${{ matrix.subs }}
          FILES: ${{ matrix.files }}
          PACKAGES: ${{ inputs.packages || 'luci luci-compat luci-i18n-base-zh-cn' }}
          PROTECTED: luci luci-base luci-compat base-files
        run: |
          cat > gen_config.py <<'PY'
          import os, re, sys, json

          t = os.environ["TARGET"]

          # matrix.subs / matrix.files 是 JSON 数组经 GitHub 表达式渲染成的字符串，
          # 多元素时中间元素的引号/空格不能靠 strip 清掉，必须 json.loads；
          # 解析失败再按逗号切分并逐元素去引号兜底。
          def parse_list(raw):
              raw = raw.strip()
              try:
                  v = json.loads(raw)
                  if isinstance(v, list):
                      return [str(x).strip() for x in v if str(x).strip()]
              except Exception:
                  pass
              return [p.strip().strip("\"'") for p in raw.split(",")
                      if p.strip().strip("\"'")]

          subs = parse_list(os.environ["SUBS"])
          files = parse_list(os.environ["FILES"])
          if len(subs) != len(files):
              print("::error::SUBS 与 FILES 数量不一致: %s / %s" % (subs, files))
              sys.exit(1)

          meta = open("tmp/.config-target.in", encoding="utf-8", errors="replace").read()

          # 机型符号在元数据里是：menuconfig TARGET_DEVICE_<t>_<sub>_DEVICE_<dev>
          # 所有 TARGET_DEVICE_* 都位于 depends on TARGET_MULTI_PROFILE 的菜单内，
          # 必须显式打开 MULTI_PROFILE，否则 --defconfig 会把它们全部丢弃。
          wanted = {}
          lines = ["CONFIG_TARGET_%s=y" % t]
          for sub, fname in zip(subs, files):
              devs = [l.strip() for l in open("plan/" + fname)
                      if l.strip() and not l.startswith("#")]
              pref = "TARGET_DEVICE_%s_%s_DEVICE_" % (t, sub)
              raw = re.findall(r"^\s*menuconfig\s+(%s\S+)\s*$" % re.escape(pref), meta, re.M)
              syms = {}
              for s in raw:
                  syms[re.sub(r"[^a-z0-9]", "_", s[len(pref):].lower())] = "CONFIG_" + s
              if not syms:
                  print("::error::元数据里没有 %s/%s 的机型符号（tmp/.config-target.in 不完整）" % (t, sub))
                  sys.exit(1)
              picked, missing = [], []
              for d in devs:
                  s = syms.get(re.sub(r"[^a-z0-9]", "_", d.lower()))
                  (picked.append(s) if s else missing.append(d))
              if missing:
                  print("::error::%s/%s 源码树中不存在这些机型: %s" % (t, sub, " ".join(missing)))
                  sys.exit(1)
              lines += ["CONFIG_TARGET_%s_%s=y" % (t, sub),
                        "CONFIG_TARGET_MULTI_PROFILE=y",
                        "# CONFIG_TARGET_ALL_PROFILES is not set",
                        "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"]
              lines += ["%s=y" % s for s in picked]
              wanted[sub] = devs
              print("%s/%s: %d 台机型已写入" % (t, sub, len(picked)))

          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]
          lines += ["CONFIG_DEVEL=y", "CONFIG_CCACHE=y"]
          lines += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]

          # 上轮 verify 发现的多余机型（defconfig 自动多开的），本回合显式关掉
          if os.path.exists("fix.txt"):
              fix = [l.strip() for l in open("fix.txt") if l.strip()]
              lines += fix
              print("显式关闭 %d 个上轮多开的机型" % len(fix))

          open(".config", "w").write("\n".join(lines) + "\n")
          open("wanted.json", "w").write(json.dumps(wanted, indent=1))
          PY

          cat > verify_config.py <<'PY'
          import os, re, sys, json

          t = os.environ["TARGET"]
          wanted = json.load(open("wanted.json"))
          cfg = open(".config", encoding="utf-8", errors="replace").read()
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())
          fix = []
          rc = 0
          for sub, devs in sorted(wanted.items()):
              pref = r"CONFIG_TARGET_DEVICE_%s_%s_DEVICE_" % (t, sub)
              got = {norm(m) for m in re.findall(r"^%s(\S+)=y$" % pref, cfg, re.M)}
              wmap = {norm(d): d for d in devs}
              missing = [w for k, w in wmap.items() if k not in got]
              extra = [g for g in got if g not in wmap]
              print("%s/%s: 预期 %d 台，实际选中 %d 台" % (t, sub, len(wmap), len(got & set(wmap))))
              if missing:
                  print("::error::%s/%s 被 kconfig 丢弃 %d 台: %s"
                        % (t, sub, len(missing), " ".join(missing[:15])))
                  rc = 1
              # defconfig 自动多开的机型必须显式关闭，否则产物会混入非目标机型
              for g in sorted(extra):
                  fix.append("# CONFIG_TARGET_DEVICE_%s_%s_DEVICE_%s is not set" % (t, sub, g))
          if fix:
              open("fix.txt", "w").write("\n".join(fix) + "\n")
              print("发现 %d 个多开机型，已写入 fix.txt 待显式关闭" % len(fix))
              rc = 2 if rc == 0 else rc
          for p in ("luci", "luci-compat", "luci-i18n-base-zh-cn"):
              flag = "CONFIG_PACKAGE_%s=y" % p
              print(("OK   " if flag in cfg else "WARN ") + flag)
          sys.exit(rc)
          PY

          mkdir -p plan tmp
          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"

            if ! make -j1 prepare-tmpinfo > prepare.log 2>&1; then
              tail -40 prepare.log
              echo "::endgroup::"
              echo "::error::prepare-tmpinfo 失败（主机依赖缺失或 package 元数据有错），见上方日志"
              exit 1
            fi
            grep -E "Please install|Build dependency|Failed to build" prepare.log | head -10 || true

            python3 gen_config.py

            if ! make -j1 defconfig > defconfig.log 2>&1; then
              tail -40 defconfig.log
              echo "::endgroup::"
              echo "::error::make defconfig 执行失败"
              exit 1
            fi

            vrc=0
            python3 verify_config.py || vrc=$?

            if [ "$vrc" = "0" ]; then
              ok=1
              echo "::endgroup::"
              break
            fi

            # verify 返回 2 = 有 defconfig 多开的机型，fix.txt 已生成，下一轮显式关闭
            if [ "$vrc" = "2" ] && [ -f fix.txt ]; then
              echo "::warning::defconfig 多开了机型，重试并显式关闭"
              echo "::endgroup::"
              continue
            fi

            # 递归依赖：禁用问题 feed 包后重试
            if grep -q "recursive dependency detected" defconfig.log; then
              echo "::warning::检测到 Kconfig 递归依赖（feed 元数据 bug），禁用问题包后重试"
              grep -A2 "recursive dependency detected" defconfig.log | head -8 || true
              bad=$(grep -oE "symbol PACKAGE_[A-Za-z0-9_.+-]+ depends on PACKAGE_" defconfig.log \
                    | sed -E 's/^symbol PACKAGE_([^ ]+) .*/\1/' | sort -u)
              echo "问题包: ${bad:-（未解析出包名）}"
              changed=0
              for p in $bad; do
                if echo " $PROTECTED " | grep -q " $p "; then
                  echo "::error::$p 属于必需包，不能自动禁用，请手工修 feed"
                  echo "::endgroup::"
                  exit 1
                fi
                while IFS= read -r d; do
                  [ -z "$d" ] && continue
                  if [ -f "$d/Makefile" ]; then
                    mv "$d/Makefile" "$d/Makefile.disabled"
                    echo "已禁用: $d"
                    changed=1
                  fi
                done < <(find feeds package/feeds -maxdepth 3 -type d -name "$p" 2>/dev/null || true)
              done
              echo "::endgroup::"
              if [ "$changed" = "1" ]; then
                rm -f tmp/.packageinfo tmp/.config-package.in
                continue
              fi
              echo "::error::检测到递归依赖但没定位到包目录，见 defconfig.log"
              exit 1
            fi

            echo "::error::.config 校验未通过（kconfig 丢机型且无 fix 可用）"
            echo "===== .config 前 25 行 ====="
            head -25 .config || true
            echo "===== defconfig.log 尾部 ====="
            tail -30 defconfig.log || true
            echo "::endgroup::"
            exit 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::尝试 3 次仍未得到有效 .config"
            exit 1
          fi

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          nproc
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log

      - name: 失败诊断
        if: failure()
        run: |
          for f in prepare.log defconfig.log feeds-update.log feeds-install.log build.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.group }}
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验每台机型的产物
        run: |
          mkdir -p out
          # matrix.subs / matrix.files 是 JSON 数组字符串，转成空格分隔列表
          SUBS=$(echo "${{ matrix.subs }}" | tr -d '[]",' )
          FILES=$(echo "${{ matrix.files }}" | tr -d '[]",' )
          TARGET="${{ matrix.target }}"

          for sub in $SUBS; do
            d="bin/targets/$TARGET/$sub"
            if [ -d "$d" ]; then
              find "$d" -maxdepth 1 -type f -exec cp {} out/ \; 2>/dev/null || true
            else
              echo "::warning::产物目录不存在: $d"
            fi
          done

          miss=0; total=0
          SUMMARY_ROWS=""
          for f in $FILES; do
            sub="${f#*__}"; sub="${sub%.txt}"
            while IFS= read -r dev; do
              [ -z "$dev" ] && continue
              total=$((total+1))
              if ls out/ 2>/dev/null | grep -qF -- "$dev"; then
                echo "  ✔ $sub/$dev"
              else
                echo "::warning::$sub/$dev 已选中但没找到产物（可能该机型只出 initramfs）"
                miss=$((miss+1))
              fi
              fl=$(ls out 2>/dev/null | grep -F -- "$dev" | head -6 | tr '\n' '<br>')
              SUMMARY_ROWS="$SUMMARY_ROWS|$sub|$dev|${fl:-—}|\n"
            done < "plan/$f"
          done
          echo "产物文件数: $(ls out | wc -l)，机型: $total，缺失: $miss"

          {
            echo "## 🏗️ ${{ matrix.group }} 编译完成"
            echo ""
            echo "- 机型: $total 台，产物文件: $(ls out | wc -l) 个，缺失: $miss 台"
            echo ""
            echo "| subtarget | 机型 | 文件 |"
            echo "|---|---|---|"
            printf "$SUMMARY_ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.group }}
          path: out/
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 发布 Release：lede-ipqxx-日期（只新增，绝不删除/覆盖历史 release）
      # ============================================================
      - name: 发布 Release（lede-ipqxx-日期）
        if: ${{ inputs.make_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          G=$(echo "${{ matrix.group }}" | tr 'A-Z' 'a-z')
          TAG="lede-${G}-$(TZ=Asia/Shanghai date +%Y%m%d)"

          # 同日重跑时 tag 已存在 -> 追加 run 号，绝不覆盖已有 release
          if gh release view "$TAG" >/dev/null 2>&1; then
            OLD="$TAG"
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            echo "::warning::tag ${OLD} 已有 release（历史保留），本次使用 ${TAG}"
          fi

          cat > notes.md <<EOF
          LEDE ${{ github.ref_name }} 自动编译（${{ matrix.group }}，${{ matrix.count }} 台机型）

          - 触发方式: ${{ github.event_name }}
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          机型清单与产物对应关系见 Actions 运行页的 Job Summary。
          EOF

          ls -lh out/
          gh release create "$TAG" out/* \
            --title "LEDE ${{ matrix.group }} · $TAG" \
            --notes-file notes.md
          echo "已发布: $TAG"
