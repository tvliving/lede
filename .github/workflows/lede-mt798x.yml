#=====================================================================================
# Build Lede (coolsnowwolf/lede) for ALL MT798x devices (filogic target)
# 单 job 顺序编译：MT7981 → MT7986 → MT7988，每个平台编完把固件保留到 out/ 目录，最后统一上传
# 覆盖 lede 源码 filogic.mk 中全部 62 台设备（34 + 21 + 7）
# 每周一、周四 07:00 (北京时间) 自动编译 = UTC 周日/周三 23:00
# Release 标签 Lede-MT7981-YYYY-MM-DD 等，保留历史，不删除
#=====================================================================================

name: Build Lede MT798x

on:
  schedule:
    - cron: '0 23 * * 0,3'
  workflow_dispatch:
    inputs:
      chips:
        description: "选择编译平台"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - MT7981
          - MT7986
          - MT7988

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 清理 runner 磁盘空间
        run: |
          # 注意：不要删除 /etc/apt/sources.list.d/ —— ubuntu-24.04 的 apt 源就在这里
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo -E apt-get -y purge azure-cli* ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          df -hT

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential clang cmake cpio curl device-tree-compiler ecj fastjar \
            flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev
          git config --global user.name "GitHub Actions" && git config --global user.email "actions@github.com"

      - name: 克隆 lede 源码并更新 feeds
        working-directory: ${{ github.workspace }}
        run: |
          df -hT $PWD
          git clone --depth 1 ${REPO_URL} -b ${REPO_BRANCH} lede
          cd lede
          echo "================= 最新提交 ================="
          git log -1 --format="commit: %H  date: %ci"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      #===============================================================================
      # 顺序编译：MT7981 → MT7986 → MT7988
      # 每个平台编完把成品固件拷到 out/<平台>/ 保留，再继续下一个
      # 三个平台同属 filogic 子目标：工具链和软件包只编译一次，后两轮基本只是打包
      #===============================================================================
      - name: 顺序编译全部平台
        working-directory: ${{ github.workspace }}/lede
        run: |
          # 手动触发可选单平台，定时/手动 all 编全部
          chips_to_build="MT7981 MT7986 MT7988"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.chips }}" != "all" ]]; then
            chips_to_build="${{ inputs.chips }}"
          fi
          echo "本次编译平台：$chips_to_build"

          device_list_for() {
            case "$1" in
              MT7981)
                echo "airpi_ap3000m abt_asr3000 cetron_ct3003 cetron_ct3003-mod cmcc_a10 cmcc_a10-mod cmcc_rax3000m-emmc cmcc_rax3000m-nand cmcc_rax3000me-emmc cmcc_rax3000me-nand cmcc_xr30-emmc cmcc_xr30-nand cudy_tr3000-256mb-v1 cudy_tr3000-mod cudy_tr3000-v1 fzs_5gcpe-p3 glinet_gl-mt2500 glinet_gl-mt3000 glinet_gl-x3000 glinet_gl-xe3000 h3c_magic-nx30-pro huasifei_wh3000-emmc huasifei_wh3000-pro huasifei_ws3006 huasifei_ws3009 imou_lc-hx3001 jcg_q30-pro konka_komi-a31 nokia_ea0326gmp openembed_som7981 qihoo_360t7 tenbay_wr3000k xiaomi_mi-router-ax3000t xiaomi_mi-router-wr30u"
                ;;
              MT7986)
                echo "asus_tuf-ax4200 asus_tuf-ax6000 bananapi_bpi-r3 bananapi_bpi-r3-mini-emmc bananapi_bpi-r3-mini-nand clx_s20l glinet_gl-mt6000 hf_m7986r1-emmc hf_m7986r1-nand jdcloud_re-cs-05 mediatek_mt7986a-rfb mediatek_mt7986b-rfb netcore_n60 netcore_n60-pro ruijie_rg-x60-pro tplink_tl-xdr4288 tplink_tl-xdr6086 tplink_tl-xdr6088 tplink_tl-xtr8488 xiaomi_redmi-router-ax6000 xiaomi_redmi-router-ax6000-stock"
                ;;
              MT7988)
                echo "bananapi_bpi-r4 bananapi_bpi-r4-poe bananapi_bpi-r4-lite glinet_gl-mt3600be mediatek_mt7988a-rfb tenda_be12-pro tplink_tl-7dr7299-v1"
                ;;
            esac
          }

          # BPI-R3/R4/R4-Lite/RFB 等设备的复合镜像（sdcard.img.gz / 多套 ARTIFACT）
          # 需要多套 bl2 + u-boot 引导，这些是独立的 boot 包，必须显式选入 .config
          # （uboot 包自带 trusted-firmware-a 依赖，下面再显式补关键 TF-A 变体双保险）
          extra_pkgs_for() {
            case "$1" in
              MT7986)
                echo "uboot-mediatek-mt7986_bananapi_bpi_r3-emmc uboot-mediatek-mt7986_bananapi_bpi_r3-sdmmc uboot-mediatek-mt7986_bananapi_bpi_r3-snand uboot-mediatek-mt7986_bananapi_bpi_r3-nor uboot-mediatek-mt7986_rfb trusted-firmware-a-mt7986-sdmmc-ddr4 trusted-firmware-a-mt7986-spim-nand-ddr4 trusted-firmware-a-mt7986-emmc-ddr4 trusted-firmware-a-mt7986-nor-ddr4 trusted-firmware-a-mt7986-snand-ddr4 trusted-firmware-a-mt7986-spim-nand-ubi-ddr4"
                ;;
              MT7988)
                echo "uboot-mediatek-mt7988_bananapi_bpi_r4-emmc uboot-mediatek-mt7988_bananapi_bpi_r4-sdmmc uboot-mediatek-mt7988_bananapi_bpi_r4-snand uboot-mediatek-mt7988_bananapi_bpi_r4_poe-emmc uboot-mediatek-mt7988_bananapi_bpi_r4_poe-sdmmc uboot-mediatek-mt7988_bananapi_bpi_r4_poe-snand uboot-mediatek-mt7987_bananapi_bpi_r4_lite-emmc uboot-mediatek-mt7987_bananapi_bpi_r4_lite-sdmmc uboot-mediatek-mt7987_bananapi_bpi_r4_lite-snand uboot-mediatek-mt7987_bananapi_bpi_r4_lite-nor trusted-firmware-a-mt7987-emmc-comb trusted-firmware-a-mt7987-nor-comb trusted-firmware-a-mt7987-sdmmc-comb trusted-firmware-a-mt7987-spim-nand0-ubi-comb trusted-firmware-a-mt7987-spim-nand2-ubi-comb trusted-firmware-a-mt7988-emmc-comb trusted-firmware-a-mt7988-nor-comb trusted-firmware-a-mt7988-sdmmc-comb trusted-firmware-a-mt7988-snand-comb trusted-firmware-a-mt7988-snand-ubi-comb trusted-firmware-a-mt7988-spim-nand-comb trusted-firmware-a-mt7988-spim-nand-ubi-comb trusted-firmware-a-mt7988-tplink-tl-7dr7299-comb"
                ;;
            esac
          }

          build_chip() {
            local chip="$1"
            local devices; devices=$(device_list_for "$chip")
            echo ""
            echo "############################################################"
            echo "##########  开始编译 $chip（$(echo $devices | wc -w) 台设备）  ##########"
            echo "############################################################"

            {
              echo "CONFIG_TARGET_mediatek=y"
              echo "CONFIG_TARGET_mediatek_filogic=y"
              echo "CONFIG_TARGET_MULTI_PROFILE=y"
              echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"
              for d in $devices; do
                echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${d}=y"
              done
              for p in $(extra_pkgs_for "$chip"); do
                echo "CONFIG_PACKAGE_${p}=y"
              done
              echo "CONFIG_PACKAGE_luci=y"
              echo "CONFIG_PACKAGE_luci-compat=y"
              echo "CONFIG_PACKAGE_default-settings-chn=y"
            } > .config
            make defconfig

            echo ">>> [$chip] 已选设备："
            grep "CONFIG_TARGET_DEVICE" .config | sed 's/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_//;s/=y//' | tr '\n' ' '
            echo ""

            echo ">>> [$chip] 下载软件包"
            make download -j$(nproc)
            find dl -size -1024c -exec rm -f {} \;

            echo ">>> [$chip] 开始编译"
            if ! make -j$(nproc); then
              echo ">>> [$chip] 并行编译失败，改用单线程重试以定位错误"
              make -j1 V=s || { echo ">>> [$chip] ❌ 编译失败"; return 1; }
            fi

            echo ">>> [$chip] 收集固件到 out/$chip/"
            mkdir -p "$GITHUB_WORKSPACE/out/$chip"
            find bin/targets/mediatek/filogic -type f \( -name "*squashfs-sysupgrade*" -o -name "*squashfs-factory*" \) \
              ! -name "*json*" -exec cp {} "$GITHUB_WORKSPACE/out/$chip/" \;
            ls -lh "$GITHUB_WORKSPACE/out/$chip/"
            local n; n=$(ls "$GITHUB_WORKSPACE/out/$chip" | wc -l)
            if [[ "$n" -eq 0 ]]; then
              echo ">>> [$chip] ❌ 没有产出任何固件"
              return 1
            fi
            echo ">>> [$chip] ✅ 完成，共 $n 个固件"
          }

          # 单平台失败只记录、不中断：继续编译下一个平台，最后汇总
          FAILED=""
          for chip in $chips_to_build; do
            if build_chip "$chip"; then
              echo ">>> [$chip] ✅ 全部完成"
            else
              echo ">>> [$chip] ❌ 编译失败（详见上方日志），继续下一个平台"
              FAILED="$FAILED $chip"
            fi
          done
          if [[ -n "$FAILED" ]]; then
            echo "::warning::以下平台编译失败:$FAILED（其余平台固件照常发布）"
            echo "$FAILED" > "$GITHUB_WORKSPACE/failed_chips.txt"
          fi

          echo ""
          echo "================= 全部平台编译完成，out 目录汇总 ================="
          du -sh "$GITHUB_WORKSPACE"/out/*
          df -hT

      - name: 上传到 Release
        working-directory: ${{ github.workspace }}/lede
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for chip in MT7981 MT7986 MT7988; do
            dir="$GITHUB_WORKSPACE/out/$chip"
            [[ -d "$dir" && -n "$(ls -A "$dir" 2>/dev/null)" ]] || { echo ">>> $chip 无固件，跳过上传"; continue; }

            TAG="Lede-${chip}-$(TZ=Asia/Shanghai date +%Y-%m-%d)"
            echo ">>> 上传 $chip → $TAG（$(ls "$dir" | wc -l) 个文件）"

            {
              echo "### Lede for $chip"
              echo "- 源码：[coolsnowwolf/lede](${REPO_URL}/tree/${REPO_BRANCH})"
              echo "- 编译时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') (UTC+8)"
              echo "- 默认 IP：192.168.1.1 / 用户名 root / 密码：无"
              echo "### 固件列表"
              ls "$dir"
            } > notes_$chip.md

            # 只创建、不删除：已存在则复用，历史版本全部保留
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Lede $chip ($(TZ=Asia/Shanghai date +%Y-%m-%d))" \
                --notes-file "notes_$chip.md"

            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$dir"/* --repo "$GITHUB_REPOSITORY" --clobber; then
                echo ">>> ✅ $chip 上传完成"
                ok=1
                break
              fi
              echo ">>> ⚠️ $chip 第 $i 次上传失败，10 秒后重试"
              sleep 10
            done
            [[ "$ok" -eq 1 ]] || { echo ">>> ❌ $chip 上传 5 次均失败"; exit 1; }
          done
          echo ">>> 🎉 全部上传完成"
