#=====================================================================================
# Debug: 单独复现 package/libs/gettext-full [host] 的编译错误
#=====================================================================================
# 2026-11-15 Build Lede BT-R320 (#43718614150) 死在：
#     make[3] -C package/libs/gettext-full host-compile
#         ERROR: package/libs/gettext-full [host] failed to build.
# 而且 7 秒就退出、world 默认详细度下没有留下任何子命令输出，无法定位。
# 本 workflow 只做一件事：在同样的 ubuntu-24.04 环境里，用 -j1 V=s 单独编
# gettext-full 的 host 部分，把完整错误打到日志里。
#=====================================================================================

name: Debug gettext-full host

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/tvliving/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 清理 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT /

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential clang cmake cpio curl device-tree-compiler ecj fastjar \
            flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev
          autoconf --version | head -1; automake --version | head -1; autopoint --version | head -1

      - name: 克隆源码并更新 feeds
        run: |
          git clone --depth 1 ${REPO_URL} -b ${REPO_BRANCH} lede
          cd lede
          git log -1 --format="commit: %H  date: %ci"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat package/libs/gettext-full/Makefile | sed -n '1,45p'

      - name: 生成最简配置
        working-directory: ${{ github.workspace }}/lede
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_globitel_bt-r320=y"
            echo "CONFIG_PACKAGE_libintl-full=y"
          } > .config
          make defconfig

      - name: 安装 tools（gettext 依赖 gnulib/libtool 等 host 工具）
        working-directory: ${{ github.workspace }}/lede
        run: |
          set -o pipefail
          make -j$(nproc) tools/install > tools.log 2>&1 || {
            echo ">>> 并行失败，串行重试"; make -j1 tools/install 2>&1 | tail -40 || exit 1; }
          echo ">>> tools 就绪"
          ls -l staging_dir/host/bin/gnulib-tool staging_dir/host/bin/autopoint 2>&1 || true
          staging_dir/host/bin/gnulib-tool --version 2>&1 | head -3 || true

      - name: 单独编 gettext-full (host)，完整输出
        working-directory: ${{ github.workspace }}/lede
        run: |
          set -o pipefail
          make -j1 V=s package/libs/gettext-full/host/compile 2>&1 | tee gettext.log
          rc=${PIPESTATUS[0]}
          echo ">>> exit code = $rc"
          exit $rc

      - name: 失败时收集关键信息
        if: failure()
        working-directory: ${{ github.workspace }}/lede
        run: |
          echo "===== 错误行 ====="
          grep -nE 'rror|No such file|not found|undefined|Cannot' gettext.log | tail -60 || true
          echo "===== 构建目录 ====="
          ls -l build_dir/hostpkg/ 2>/dev/null | tail -20 || true
          echo "===== gettext autogen/config.log 尾部 ====="
          for f in build_dir/hostpkg/gettext-*/config.log build_dir/hostpkg/gettext-*/autogen.log; do
            [ -f "$f" ] && { echo "--- $f"; tail -60 "$f"; }
          done || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gettext-debug-log
          path: |
            lede/gettext.log
            lede/tools.log
          retention-days: 5
          if-no-files-found: ignore
