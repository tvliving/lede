      - name: 下载源码包
        run: |
          cd openwrt
          make -j8 download < /dev/null || true
          make -j1 download < /dev/null 2>&1 | tail -20 || true

      - name: 编译固件
        run: |
          cd openwrt
          export CCACHE_DIR CCACHE_MAXSIZE CCACHE_COMPRESS CCACHE_NOHASHDIR
          mkdir -p "$CCACHE_DIR"
          set -o pipefail
          if make -j"$(nproc)" 2>&1 | tee build.log; then
            echo ">>> ✅ 编译成功"
          else
            echo "::warning::并行编译失败，单线程复现"
            fail="$(grep -o 'ERROR: [^ ]* failed to build' build.log | head -1 | awk '{print $2}')"
            if [ -n "$fail" ]; then make -j1 V=s "$fail/compile" 2>&1 | tail -150 || true; else make -j1 V=s 2>&1 | tail -150 || true; fi
            exit 1
          fi

      - name: 产物硬校验（官方设备产物齐全）
        run: |
          set -uo pipefail
          B=openwrt/bin/targets/mediatek/filogic
          test -d "$B" || { echo "::error::没有 $B 目录"; ls -R openwrt/bin/targets 2>/dev/null | head -40; exit 1; }
          echo "===== bin/targets/mediatek/filogic ====="
          ls -lh "$B" | head -40
          miss=0
          ls "$B"/*"$DEVICE"*squashfs-sysupgrade.itb >/dev/null 2>&1 \
            || { echo "  [FAIL] 缺 sysupgrade.itb"; miss=$((miss+1)); }
          ls "$B"/*"$DEVICE"*bl31-uboot.fip >/dev/null 2>&1 \
            || { echo "  [FAIL] 缺 bl31-uboot.fip"; miss=$((miss+1)); }
          ls "$B"/*"$DEVICE"*preloader.bin >/dev/null 2>&1 \
            || { echo "  [FAIL] 缺 preloader.bin"; miss=$((miss+1)); }
          [ "$miss" -eq 0 ] || { echo "::error::产物校验失败 $miss 项"; exit 1; }
          echo "✔ 官方产物齐全（sysupgrade + FIP + preloader）"

          KC=""
          for _c in build_dir/target-*/linux-mediatek_filogic/linux-*/.config; do [ -f "$_c" ] && { KC="$_c"; break; }; done
          if [ -n "$KC" ]; then
            echo "===== 内核关键项 ====="
            grep -E '^(CONFIG_NET_DSA_AN8855|CONFIG_NET_DSA_MT7530)=' "$KC" || true
          fi

      - name: 收集产物（sysupgrade.itb + FIP + preloader）
        run: |
          set -euo pipefail
          B=openwrt/bin/targets/mediatek/filogic
          mkdir -p out
          shopt -s nullglob
          shopt -s nullglob
          for f in "$B"/*"$DEVICE"*; do
            case "$f" in
              *squashfs-sysupgrade.itb|*bl31-uboot.fip|*preloader.bin|*.manifest)
                cp -f "$f" out/ ;;
            esac
          done
          # 统一前缀（openwrt- / mediatek- → 仓库前缀）
          for f in out/*; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            case "$b" in
              "$PREFIX"-*) : ;;
              openwrt-*) mv -f "$f" "out/${PREFIX}-${b#openwrt-}" ;;
              mediatek-*) mv -f "$f" "out/${PREFIX}-${b}" ;;
            esac
          done
          sysup=( out/*squashfs-sysupgrade.itb )
          [ "${#sysup[@]}" -eq 1 ] || {
            echo "::error::期望正好 1 个 sysupgrade.itb，实际 ${#sysup[@]} 个"; ls -lh out; exit 1; }
          fips=( out/*bl31-uboot.fip )
          [ "${#fips[@]}" -eq 1 ] || {
            echo "::error::期望正好 1 个 bl31-uboot.fip，实际 ${#fips[@]} 个"; ls out; exit 1; }
          pre=( out/*preloader.bin )
          [ "${#pre[@]}" -eq 1 ] || {
            echo "::error::期望正好 1 个 preloader.bin，实际 ${#pre[@]} 个"; ls out; exit 1; }

          # nullglob 下 `MAN=$(ls out/*.manifest)` 会退化成 `ls` 列当前目录，
          # 曾把 BSDmakefile 当成清单 → 6 项全灭。用数组 + rootfs 包数据库兜底。
          manif=( out/*.manifest )
          MAN=""
          if [ ${#manif[@]} -gt 0 ]; then MAN="${manif[0]}"; fi
          PKGS=$(mktemp)
          if [ -n "$MAN" ]; then
            awk '{print $1}' "$MAN" | grep -v '^$' > "$PKGS" || true
            echo "[info] 用 manifest 校验：$MAN"
          else
            PKGDB=$(find build_dir -maxdepth 5 -type f \( -path '*/apk/db/installed' -o -path '*/opkg/status' \) 2>/dev/null | head -1 || true)
            if [ -n "$PKGDB" ]; then
              case "$PKGDB" in
              */apk/db/installed) sed -n 's/^P:\(.*\)$/\1/p' "$PKGDB" > "$PKGS" ;;
                *) sed -n 's/^Package: \(.*\)$/\1/p' "$PKGDB" > "$PKGS" ;;
              esac
              echo "[info] 无 .manifest，改用 rootfs 包数据库校验：$PKGDB"
            fi
          fi
          if [ ! -s "$PKGS" ]; then
            echo "::warning::拿不到包清单（无 .manifest 且未找到 rootfs 包数据库），跳过端到端包校验"
            ls -lh out || true
          else
            echo "===== 包清单校验（$(wc -l < "$PKGS") 个包）====="
            miss=0
            for k in kmod-mt7915e mt7986-wo-firmware luci-app-passwall luci-app-store "luci-theme-${THEME}" luci-i18n-base-zh-cn; do
              if grep -qx "$k" "$PKGS"; then echo "  [ok] $k"; else echo "  [FAIL] 缺 $k"; miss=$((miss+1)); fi
            done
            if grep -qE '^(wpad-basic-mbedtls|wpad-openssl|wpad-mbedtls|wpad)$' "$PKGS"; then echo "  [ok] wpad"; else echo "  [FAIL] 缺 wpad"; miss=$((miss+1)); fi
            [ "$miss" -eq 0 ] || { echo "::error::镜像清单校验失败 $miss 项"; exit 1; }
          fi

          ( cd out && sha256sum ./* > sha256sums.txt )
          ls -lh out
          {
            echo "## 🏗️ 红米 AX6000 ubootmod 大分区（官方 25.12）编译完成"
            echo ""
            echo "- 源码：ImmortalWrt 官方 openwrt-25.12（xiaomi_redmi-router-ax6000-ubootmod 原生支持）"
            echo "- 分区：官方 ubootmod 大分区（ubi 约 122MB），未改 DTS / 设备块 / U-Boot"
            echo "- PassWall：50 条访问控制（10.0.0.2 - 10.0.0.51，模式=代理）"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -lh out | tail -n +2 | awk '{printf "| %s | %s |\n", $9, $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-redmi-ax6000-ubootmod
          path: out/
          retention-days: 14
          if-no-files-found: error

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-redmi-ax6000-ubootmod
          path: |
            openwrt/build.log
            openwrt/.config
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  release:
    name: 📦 发布 lede-25.12-日期-redmi-ax6000-ubootmod
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.make_release) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-redmi-ax6000-ubootmod
          path: rel

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum ./* > sha256sums.txt

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          TAG="${PREFIX}-${VERSION}-${DATE}-redmi-ax6000-ubootmod"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<'EOF'
          Lede 25.12（immortalwrt/openwrt-25.12）· 红米 Redmi AX6000 ubootmod 大分区

          - 机型：MT7986A，官方 `xiaomi_redmi-router-ax6000-ubootmod`，ubi 分区约 122MB（0x580000 + 0x7a80000）
          - 源码：ImmortalWrt 官方 `openwrt-25.12`，DTS / filogic.mk 设备块 / U-Boot 变体全部来自官方，未改动
          - 刷机：需先刷入 ubootmod 的 U-Boot（bl31-uboot.fip + preloader.bin），再用 sysupgrade.itb
          - PassWall：官方 luci feed 原生包，预置 50 条访问控制（源 10.0.0.2-10.0.0.51，模式=代理，主开关已开）；
            rust / 重依赖可选组件已关闭；全局代理开关保持默认关闭，加好节点后再开
          - 无线：mt7915e，首启双频 AP `REDMI-AX6000-2.4G / REDMI-AX6000-5G`（CN、5G HE160、2.4G HE40）
          - 界面：vantage + iStore 市场 + 全量简体中文 + 强制 zh_cn
          - 产物：sysupgrade.itb + bl31-uboot.fip + preloader.bin
          EOF
          for i in 1 2 3 4 5; do
            echo ">>> 第 $i 次上传"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "Lede 25.12 · 红米 AX6000 ubootmod 大分区 · ${DATE}" --notes-file notes.md || true
            fi
            if gh release upload "$TAG" rel/* --clobber; then
              echo ">>> 上传成功（第 $i 次）"; exit 0
            fi
            sleep $((i * 30))
          done
          echo "::error::Release 上传失败，产物已保留在 Actions artifacts"
          exit 1
