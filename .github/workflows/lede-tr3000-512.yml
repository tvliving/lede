name: 🌿 LEDE Cudy TR3000 512MB Build

# 每周一、周四 07:00 (北京时间) 自动编译 = UTC 周日/周三 23:00
on:
  schedule:
    - cron: '0 23 * * 0,3'
  workflow_dispatch:
    inputs:
      packages:
        description: '1、额外固件包（空格分隔，默认已含 LuCI 中文界面）'
        required: false
        default: 'luci luci-compat luci-i18n-base-zh-cn'
      make_release:
        description: '2、是否发布到 Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: lede-tr3000-512-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVICE: cudy_tr3000-512mb-v1

jobs:
  # ============================================================
  # Job 1：确认机型已在源码树中
  # ============================================================
  prepare:
    name: 🧭 机型检查
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (仅取 filogic.mk)
        uses: actions/checkout@v5
        with:
          sparse-checkout: target/linux/mediatek/image/filogic.mk
          sparse-checkout-cone-mode: false

      - name: 校验机型定义
        run: |
          DEV=cudy_tr3000-512mb-v1
          if grep -q "TARGET_DEVICES += $DEV" target/linux/mediatek/image/filogic.mk; then
            echo "✔ 源码树中已包含 $DEV 设备定义"
            echo "## 🧭 机型检查" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✔ \`$DEV\`（Cudy TR3000 512MB v1，MT7981，512MB NAND）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::源码树中没有 $DEV 设备定义——确认 filogic.mk 补丁已合入"
            exit 1
          fi

  # ============================================================
  # Job 2：编译
  # ============================================================
  build:
    name: 🏗️ TR3000 512MB
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          # 大型预装组件：dotnet/android/ghc/CodeQL/boost/node/jvm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /usr/local/.ghcup /var/lib/snapd 2>/dev/null || true
          # Docker 镜像与容器层（编译用不到，可释放 6-10GB）
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          # apt 缓存与用户缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /home/runner/.cache \
                      /home/runner/.npm /home/runner/.dotnet 2>/dev/null || true
          # 系统日志与崩溃转储
          sudo journalctl --vacuum-size=50M 2>/dev/null || true
          sudo rm -rf /var/lib/systemd/coredump 2>/dev/null || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache zstd swig time xsltproc subversion bc patch bzip2 \
            libtool-bin pkg-config autoconf automake
          sudo apt-get install -y -qq perl libthread-queue-any-perl 2>/dev/null || true

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lede-tr3000-512-${{ github.sha }}
          restore-keys: |
            ccache-lede-tr3000-512-
            ccache-

      - name: 更新 feeds（带重试与逐条诊断）
        run: |
          set -o pipefail
          echo "== feeds.conf.default ==" && cat feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a 2>&1 | tee feeds-update.log | tail -20; then ok=1; break; fi
            echo "::warning::feeds update 第 $i 次失败，10 秒后重试"
            grep -iE "fatal|error|not found|404" feeds-update.log | head -10 || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds update 连续 3 次失败，上面的 fatal/404 行就是坏掉的源"
            exit 1
          fi

          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds install -a 2>&1 | tee feeds-install.log | tail -5; then ok=1; break; fi
            echo "::warning::feeds install 第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::feeds install 失败"
            grep -iE "error|warning: \|" feeds-install.log | tail -20 || true
            exit 1
          fi

          # ---- 默认主题 vantage：树内已 vendor，兜底再拉一次；同时从 feeds 移除 argon ----
          if [ ! -f package/luci-theme-vantage/Makefile ]; then
            git clone -q --depth 1 --filter=blob:none --sparse \
              https://github.com/kiddin9/op-packages.git /tmp/kiddin9
            (cd /tmp/kiddin9 && git sparse-checkout set luci-theme-vantage luci-app-vantage)
            cp -a /tmp/kiddin9/luci-theme-vantage /tmp/kiddin9/luci-app-vantage package/
          fi
          test -f package/luci-theme-vantage/Makefile || { echo "::error::vantage 主题包缺失"; exit 1; }
          echo "✔ vantage 主题包就绪（30_luci-theme-vantage 首启自动设为默认主题）"
          rm -rf feeds/luci/themes/luci-theme-argon feeds/luci/applications/luci-app-argon-config
          echo "✔ argon 主题已从 feeds 移除"

      - name: 生成 .config（单机型 + 自动规避 feeds 的 Kconfig 递归依赖）
        env:
          TARGET: mediatek
          SUBS: '["filogic"]'
          FILES: '["device.txt"]'
          DEVICE: cudy_tr3000-512mb-v1
          PACKAGES: ${{ inputs.packages || 'luci luci-compat luci-i18n-base-zh-cn' }}
          PROTECTED: luci luci-base luci-compat base-files
        run: |
          mkdir -p plan tmp
          echo "$DEVICE" > plan/device.txt

          cat > gen_config.py <<'PY'
          import os, re, sys, json

          t = os.environ["TARGET"]

          # matrix.subs / matrix.files 是 JSON 数组经 GitHub 表达式渲染成的字符串，
          # 多元素时中间元素的引号/空格不能靠 strip 清掉，必须 json.loads；
          # 解析失败再按逗号切分并逐元素去引号兜底。
          def parse_list(raw):
              raw = raw.strip()
              try:
                  v = json.loads(raw)
                  if isinstance(v, list):
                      return [str(x).strip() for x in v if str(x).strip()]
              except Exception:
                  pass
              return [p.strip().strip("\"'") for p in raw.split(",")
                      if p.strip().strip("\"'")]

          subs = parse_list(os.environ["SUBS"])
          files = parse_list(os.environ["FILES"])
          if len(subs) != len(files):
              print("::error::SUBS 与 FILES 数量不一致: %s / %s" % (subs, files))
              sys.exit(1)

          meta = open("tmp/.config-target.in", encoding="utf-8", errors="replace").read()

          # 机型符号在元数据里是：menuconfig TARGET_DEVICE_<t>_<sub>_DEVICE_<dev>
          # 所有 TARGET_DEVICE_* 都位于 depends on TARGET_MULTI_PROFILE 的菜单内，
          # 必须显式打开 MULTI_PROFILE，否则 --defconfig 会把它们全部丢弃。
          wanted = {}
          lines = ["CONFIG_TARGET_%s=y" % t]
          for sub, fname in zip(subs, files):
              devs = [l.strip() for l in open("plan/" + fname)
                      if l.strip() and not l.startswith("#")]
              pref = "TARGET_DEVICE_%s_%s_DEVICE_" % (t, sub)
              raw = re.findall(r"^\s*menuconfig\s+(%s\S+)\s*$" % re.escape(pref), meta, re.M)
              syms = {}
              for s in raw:
                  syms[re.sub(r"[^a-z0-9]", "_", s[len(pref):].lower())] = "CONFIG_" + s
              if not syms:
                  print("::error::元数据里没有 %s/%s 的机型符号（tmp/.config-target.in 不完整）" % (t, sub))
                  sys.exit(1)
              picked, missing = [], []
              for d in devs:
                  s = syms.get(re.sub(r"[^a-z0-9]", "_", d.lower()))
                  (picked.append(s) if s else missing.append(d))
              if missing:
                  print("::error::%s/%s 源码树中不存在这些机型: %s" % (t, sub, " ".join(missing)))
                  sys.exit(1)
              lines += ["CONFIG_TARGET_%s_%s=y" % (t, sub),
                        "CONFIG_TARGET_MULTI_PROFILE=y",
                        "# CONFIG_TARGET_ALL_PROFILES is not set",
                        "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"]
              lines += ["%s=y" % s for s in picked]
              wanted[sub] = devs
              print("%s/%s: %d 台机型已写入" % (t, sub, len(picked)))

          pkgs = [p for p in os.environ.get("PACKAGES", "").split() if p]
          lines += ["CONFIG_DEVEL=y", "CONFIG_CCACHE=y"]
          lines += ["CONFIG_PACKAGE_%s=y" % p for p in pkgs]
          # 默认主题 vantage；显式关 argon（后写优先，即使 PACKAGES 传了 argon 也不会装）
          lines += ["CONFIG_PACKAGE_luci-theme-vantage=y",
                    "# CONFIG_PACKAGE_luci-theme-argon is not set",
                    "# CONFIG_PACKAGE_luci-app-argon-config is not set"]

          # 上轮 verify 发现的多余机型（defconfig 自动多开的），本回合显式关掉
          if os.path.exists("fix.txt"):
              fix = [l.strip() for l in open("fix.txt") if l.strip()]
              lines += fix
              print("显式关闭 %d 个上轮多开的机型" % len(fix))

          open(".config", "w").write("\n".join(lines) + "\n")
          open("wanted.json", "w").write(json.dumps(wanted, indent=1))
          PY

          cat > verify_config.py <<'PY'
          import os, re, sys, json

          t = os.environ["TARGET"]
          wanted = json.load(open("wanted.json"))
          cfg = open(".config", encoding="utf-8", errors="replace").read()
          norm = lambda s: re.sub(r"[^a-z0-9]", "_", s.lower())
          fix = []
          rc = 0
          for sub, devs in sorted(wanted.items()):
              pref = r"CONFIG_TARGET_DEVICE_%s_%s_DEVICE_" % (t, sub)
              got = {norm(m) for m in re.findall(r"^%s(\S+)=y$" % pref, cfg, re.M)}
              wmap = {norm(d): d for d in devs}
              missing = [w for k, w in wmap.items() if k not in got]
              extra = [g for g in got if g not in wmap]
              print("%s/%s: 预期 %d 台，实际选中 %d 台" % (t, sub, len(wmap), len(got & set(wmap))))
              if missing:
                  print("::error::%s/%s 被 kconfig 丢弃 %d 台: %s"
                        % (t, sub, len(missing), " ".join(missing[:15])))
                  rc = 1
              # defconfig 自动多开的机型必须显式关闭，否则产物会混入非目标机型
              for g in sorted(extra):
                  fix.append("# CONFIG_TARGET_DEVICE_%s_%s_DEVICE_%s is not set" % (t, sub, g))
          if fix:
              open("fix.txt", "w").write("\n".join(fix) + "\n")
              print("发现 %d 个多开机型，已写入 fix.txt 待显式关闭" % len(fix))
              rc = 2 if rc == 0 else rc
          for p in ("luci", "luci-compat", "luci-i18n-base-zh-cn", "luci-theme-vantage"):
              flag = "CONFIG_PACKAGE_%s=y" % p
              print(("OK   " if flag in cfg else "WARN ") + flag)
          sys.exit(rc)
          PY

          ok=0
          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次生成 .config"

            if ! make -j1 prepare-tmpinfo > prepare.log 2>&1; then
              tail -40 prepare.log
              echo "::endgroup::"
              echo "::error::prepare-tmpinfo 失败（主机依赖缺失或 package 元数据有错），见上方日志"
              exit 1
            fi
            grep -E "Please install|Build dependency|Failed to build" prepare.log | head -10 || true

            python3 gen_config.py

            if ! make -j1 defconfig > defconfig.log 2>&1; then
              tail -40 defconfig.log
              echo "::endgroup::"
              echo "::error::make defconfig 执行失败"
              exit 1
            fi

            vrc=0
            python3 verify_config.py || vrc=$?

            if [ "$vrc" = "0" ]; then
              ok=1
              echo "::endgroup::"
              break
            fi

            if grep -q "recursive dependency detected" defconfig.log; then
              echo "::warning::检测到 Kconfig 递归依赖（feed 元数据 bug），禁用问题包后重试"
              grep -A2 "recursive dependency detected" defconfig.log | head -8 || true
              bad=$(grep -oE "symbol PACKAGE_[A-Za-z0-9_.+-]+ depends on PACKAGE_" defconfig.log \
                    | sed -E 's/^symbol PACKAGE_([^ ]+) .*/\1/' | sort -u)
              echo "问题包: ${bad:-（未解析出包名）}"
              changed=0
              for p in $bad; do
                if echo " $PROTECTED " | grep -q " $p "; then
                  echo "::error::$p 属于必需包，不能自动禁用，请手工修 feed"
                  echo "::endgroup::"
                  exit 1
                fi
                while IFS= read -r d; do
                  [ -z "$d" ] && continue
                  if [ -f "$d/Makefile" ]; then
                    mv "$d/Makefile" "$d/Makefile.disabled"
                    echo "已禁用: $d"
                    changed=1
                  fi
                done < <(find feeds package/feeds -maxdepth 3 -type d -name "$p" 2>/dev/null || true)
              done
              echo "::endgroup::"
              if [ "$changed" = "1" ]; then
                rm -f tmp/.packageinfo tmp/.config-package.in
                continue
              fi
              echo "::error::检测到递归依赖但没定位到包目录，见 defconfig.log"
              exit 1
            fi

            if [ "$vrc" = "2" ]; then
              echo "::warning::verify 只发现多开机型（已写入 fix.txt），重试显式关闭"
              echo "::endgroup::"
              continue
            fi

            echo "::error::.config 校验未通过"
            echo "===== .config 前 25 行 ====="
            head -25 .config || true
            echo "===== defconfig.log 尾部 ====="
            tail -30 defconfig.log || true
            echo "::endgroup::"
            exit 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::尝试 3 次仍未得到有效 .config"
            exit 1
          fi

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"

      - name: 编译
        run: |
          set -o pipefail
          nproc
          # 注意：GitHub Actions 默认以 bash -e 运行，裸管道失败会立刻退出，
          # 必须用 || rc=... 兜住，否则下面的 V=s 诊断逻辑永远执行不到
          rc=0
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败（静默模式下失败包的报错被吞），用 -j1 V=s 重跑失败包捕获真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              echo "未提取到失败包名，对全树 -j1 V=s 复现（到失败点即停）"
              make -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                case "$p" in
                  target/linux|package/*)
                    echo "===== V=s 复现 $p ====="
                    make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true ;;
                  *)
                    echo "未知失败目标 $p，跳过 V=s";;
                esac
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi

      - name: 失败诊断
        if: failure()
        run: |
          for f in prepare.log defconfig.log feeds-update.log feeds-install.log build.log error.log; do
            if [ -f "$f" ]; then
              echo "===== $f （尾部 40 行） ====="
              tail -40 "$f" || true
            fi
          done
          echo "===== .config 前 15 行 ====="
          head -15 .config 2>/dev/null || true

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-tr3000-512
          path: |
            *.log
            .config
          retention-days: 7
          if-no-files-found: warn

      - name: 校验产物
        run: |
          mkdir -p out
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img.gz' -o -name '*.ubi' \
               -o -name '*.trx' -o -name '*.tar.gz' -o -name 'sha256sums' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          # 固件名统一为 lede- 前缀（树内产物默认 openwrt-），并同步校验文件里的文件名
          shopt -s nullglob
          renamed=0
          for f in out/openwrt-*; do
            mv -f "$f" "out/lede-${f#out/openwrt-}"
            renamed=$((renamed+1))
          done
          for t in out/sha256sums out/profiles.json; do
            [ -f "$t" ] && sed -i -E 's/(^|[[:space:]"*])openwrt-/\1lede-/g' "$t"
          done
          echo "已把 $renamed 个产物改名为 lede- 前缀"

          if ls out/ 2>/dev/null | grep -qF -- "$DEVICE"; then
            echo "✔ $DEVICE 产物已生成"
          else
            echo "::error::$DEVICE 没有找到产物"
            ls -la out/ || true
            exit 1
          fi
          echo "产物文件数: $(ls out | wc -l)"

          {
            echo "## 🏗️ Cudy TR3000 512MB 编译完成"
            echo ""
            echo "- 产物文件: $(ls out | wc -l) 个"
            echo ""
            echo "| 文件 |"
            echo "|---|"
            ls out | while read -r f; do echo "| $f |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-tr3000-512
          path: out/
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # Job 3：发布到 Release（只新增，绝不删除/覆盖历史 release）
  # ============================================================
  release:
    name: 📦 发布 Release
    needs: [prepare, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || inputs.make_release)
    runs-on: ubuntu-24.04
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-tr3000-512
          path: rel

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true

      - name: 创建 Release（lede-tr3000-512-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="lede-tr3000-512-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          LEDE ${{ github.ref_name }} 自动编译（Cudy TR3000 512MB v1）

          - 触发方式: ${{ github.event_name }}
          - 机型: cudy_tr3000-512mb-v1（MT7981，512MB NAND，ubi 分区 0x1FA40000）
          - 提交: ${{ github.sha }}
          - 日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          适用于硬改 512MB Flash 的 Cudy TR3000（128MB 原版请用 cudy_tr3000-v1 固件，刷错会变砖）。
          EOF
          gh release create "$TAG" rel/* \
            --title "LEDE TR3000 512MB · $TAG" \
            --notes-file notes.md \
            --latest
