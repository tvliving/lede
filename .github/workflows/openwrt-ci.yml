name: Lede-CI

on:
  schedule:
    - cron: 0 20 * * *
  # 便于改完配置立刻验证，不用等到定时任务
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build_openwrt:

    name: Build Lede Firmware

    runs-on: ubuntu-22.04

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout Lede
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Update feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      #===============================================================================
      # feeds 是第三方仓库（coolsnowwolf/packages），不能直接推；把树内补丁复制进
      # 对应 feed 包的 patches/ 目录，由 quilt 在 prepare 阶段打上。
      # jool 4.1.13 在 linux-6.18 上编译失败
      #   rfc7915/6to4.c: 'struct flowi4' has no member named 'flowi4_tos'
      # （6.18 删掉 flowi4_tos，改为 6bit 的 flowi4_dscp；上游 Jool master 已同法修好）
      #===============================================================================
      - name: 给 feeds 打 linux-6.18 兼容补丁（jool）
        run: |
          set -e
          dst=feeds/packages/net/jool/patches
          test -f feeds/packages/net/jool/Makefile || { echo "::error::jool 包不在 feeds 期望路径"; exit 1; }
          mkdir -p "$dst"
          cp .github/feed-patches/jool/*.patch "$dst"/
          ls -l "$dst"
          echo "✔ jool feed 补丁已就位"

      # v4l2loopback 0.13.2 在 linux-6.18 上编译失败（三处内核 API 变更）：
      #   del_timer_sync → timer_delete_sync（6.15 删旧名）
      #   v4l2_fh_add()/v4l2_fh_del() 新增 struct file * 参数（6.18）
      #   defined(timer_setup) 探测失效 → 走到已删除的 setup_timer()
      # 补丁内容与上游 umlaeute/v4l2loopback master 的兼容层同源
      - name: 给 feeds 打 linux-6.18 兼容补丁（v4l2loopback）
        run: |
          set -e
          dst=feeds/packages/kernel/v4l2loopback/patches
          test -f feeds/packages/kernel/v4l2loopback/Makefile || { echo "::error::v4l2loopback 包不在 feeds 期望路径"; exit 1; }
          mkdir -p "$dst"
          cp .github/feed-patches/v4l2loopback/*.patch "$dst"/
          ls -l "$dst"
          echo "✔ v4l2loopback feed 补丁已就位"

      - name: 安装 iStore 软件中心与首页包（树内 vendor）
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/kiddin9/op-packages.git /tmp/kiddin9-store
          (cd /tmp/kiddin9-store && git sparse-checkout set luci-app-store luci-app-quickstart quickstart taskd luci-lib-taskd luci-lib-xterm)
          cp -a /tmp/kiddin9-store/luci-app-store /tmp/kiddin9-store/luci-app-quickstart \
                /tmp/kiddin9-store/quickstart /tmp/kiddin9-store/taskd \
                /tmp/kiddin9-store/luci-lib-taskd /tmp/kiddin9-store/luci-lib-xterm package/
          for p in luci-app-store luci-app-quickstart quickstart taskd luci-lib-taskd luci-lib-xterm; do
            test -f "package/$p/Makefile" || { echo "::error::iStore 包缺失: $p"; exit 1; }
          done
          echo "✔ iStore 软件中心(luci-app-store) + 首页(luci-app-quickstart) 包就绪"
          # 仪表盘：默认首页 + 守护进程开机自启（官方包缺这两处，否则刷进去看不到）
          bash scripts/quickstart-fix.sh .

      #===============================================================================
      # 闪存验证（与 tvliving/Kwrt 同一套判定）：仅给 ≥128M 闪存（或 eMMC/SD 启动）
      # 的机型注入 iStore；rootfs 分区装不下 iStore(~15MB) 的机型保持原样编译。
      #===============================================================================
      - name: 闪存验证并注入 iStore（仅 ≥128M 闪存机型）
        run: |
          python3 - <<'PYEOF'
          import re, sys
          # 排除：闪存 <128M 或 rootfs 分区装不下 iStore 的机型（实测/官方 dts 判定）
          EXCLUDE = {
            'cetron_ct3003':                  'ubi 32M',
            'cmcc_a10':                       'ubi 64M（a10-mod 才是 256M 版）',
            'cudy_tr3000-v1':                 'ubi 64M（256mb/mod 版本已单独列出）',
            'h3c_magic-nx30-pro':             '128M flash 但 rootfs 分区 64M',
            'nokia_ea0326gmp':                'ubi 86M',
            'tenbay_wr3000k':                 'ubi 48M x2（双系统分区）',
            'mediatek_mt7986a-rfb':           'IMAGE_SIZE 64M',
            'mediatek_mt7986b-rfb':           'IMAGE_SIZE 64M',
            'ruijie_rg-x60-pro':              'ubi 63M',
            'xiaomi_redmi-router-ax6000-stock':'原厂分区布局 ubi 80M',
          }
          INCLUDE = """airpi_ap3000m abt_asr3000 cetron_ct3003-mod cmcc_a10-mod cmcc_rax3000m-emmc
            cmcc_rax3000m-nand cmcc_rax3000me-emmc cmcc_rax3000me-nand cmcc_xr30-emmc cmcc_xr30-nand
            cudy_tr3000-256mb-v1 cudy_tr3000-mod fzs_5gcpe-p3 glinet_gl-mt2500 glinet_gl-mt3000
            glinet_gl-x3000 glinet_gl-xe3000 huasifei_wh3000-emmc huasifei_wh3000-pro huasifei_ws3006
            huasifei_ws3009 imou_lc-hx3001 jcg_q30-pro konka_komi-a31 openembed_som7981 qihoo_360t7
            xiaomi_mi-router-ax3000t xiaomi_mi-router-wr30u
            asus_tuf-ax4200 asus_tuf-ax6000 bananapi_bpi-r3 bananapi_bpi-r3-mini-emmc bananapi_bpi-r3-mini-nand
            clx_s20l glinet_gl-mt6000 hf_m7986r1-emmc hf_m7986r1-nand jdcloud_re-cs-05 netcore_n60
            netcore_n60-pro tplink_tl-xdr4288 tplink_tl-xdr6086 tplink_tl-xdr6088 tplink_tl-xtr8488
            xiaomi_redmi-router-ax6000
            bananapi_bpi-r4 bananapi_bpi-r4-poe bananapi_bpi-r4-lite glinet_gl-mt3600be mediatek_mt7988a-rfb
            tenda_be12-pro tplink_tl-7dr7299-v1""".split()
          path = 'target/linux/mediatek/image/filogic.mk'
          s = open(path, encoding='utf-8').read()
          miss, done = [], []
          for d in INCLUDE:
              if d in EXCLUDE:
                  continue
              m = re.search(r'(define Device/%s\n.*?\n)(\s*endef)' % re.escape(d), s, re.S)
              if not m:
                  miss.append(d); continue
              if 'luci-app-store' in m.group(1):
                  done.append(d); continue
              s = s[:m.start(2)] + '  DEVICE_PACKAGES += luci-app-store luci-app-quickstart\n' + s[m.start(2):]
              done.append(d)
          open(path, 'w', encoding='utf-8', newline='\n').write(s)
          if miss:
              print('::error::filogic.mk 中找不到这些机型（命名变更？）: %s' % ' '.join(miss)); sys.exit(1)
          print('已注入 %d 台 ≥128M 机型' % len(done))
          print('已排除（<128M 或 rootfs 装不下）:', ' '.join(sorted(EXCLUDE)))
          PYEOF

      - name: Generate configuration file
        run: |
          make defconfig
          # 简体中文语言包：全量枚举选入（LUCI_LANG_zh_Hans 的 DEFAULT 机制随上游易失效，
          # 直接按生成的包清单枚举 luci-i18n-*-zh-cn，kconfig 只保留 app 已选中的）
          awk '/^config PACKAGE_luci-i18n-.+-zh-cn$/{print $2"=y"}' tmp/.config-package.in >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          make defconfig
          grep -qE '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config \
            || { echo "::error::简体中文语言包未生效"; exit 1; }
          n=$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.+-zh-cn=y$' .config || true)
          echo "✔ 简体中文语言包 $n 个"

      - name: Download packages
        timeout-minutes: 130
        run: |
          # 2026-11-19 实证：run 44378124232 在这一步从 19:20:04Z 起 5h53m 零输出，
          # 直到 6h job 超时被 cancel（正常耗时 5~38 分钟），整轮白跑。
          # scripts/download.pl 里的 curl 只有 --connect-timeout，没有整体/低速上限，
          # 一条连接半途停摆就会永久挂住；这一步本身也没有任何超时。
          # 这里给单次下载设硬上限，且只对「被限时中止」重试；
          # 真正的下载错误仍按原样失败，不掩盖问题。
          for i in 1 2; do
            echo "::group::make download 第 ${i}/2 次（单次上限 60 分钟）"
            rc=0
            timeout --signal=INT --kill-after=60 60m make download -j16 || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "✔ 软件包下载完成"
              exit 0
            fi
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ] || [ "$rc" -eq 137 ]; then
              echo "::warning::下载被限时中止（rc=$rc，第 ${i} 次），重试"
              continue
            fi
            echo "::error::下载失败（rc=$rc），不是超时问题，见上方日志"
            exit "$rc"
          done
          echo "::error::连续 2 次在 60 分钟内没有进展：镜像或 make 卡死，需查看 dl/ 里未完成的包"
          exit 1

      - name: Compile firmware
        run: |
          # 并行编译的输出会把真正原因埋在几千行里（libxcrypt 就只留下一句
          # "failed to build"，无从下手）。这里落盘 build.log，失败后按
          # "xxx failed to build" 逐包用 -j1 V=s 重跑，把详细错误打进日志。
          #
          # 另外 tools 阶段在 make -j 下有竞态（2026-11-15 两次实证：tools/elfutils
          # 并行必失败，同一棵树 -j1 重跑 56 秒就成功了），所以先把 tools 单独装好，
          # 再跑 world；重试成功的包不算失败，继续往下编，避免整轮 3 小时白跑。
          set -o pipefail
          rm -f build.log tools.log

          echo "===== 预构建 tools（并行，失败则串行重试）====="
          if ! make -j$(nproc) tools/install > tools.log 2>&1; then
            echo "::warning::tools 并行编译失败，改单线程重试"
            grep -nE 'Error [0-9]+|error:|No rule to make target' tools.log | tail -20 || true
            make -j1 tools/install 2>&1 | tail -60 || { echo "::error::tools 单线程重试仍失败"; exit 1; }
          fi
          echo "tools 就绪"

          ok=0
          for attempt in 1 2 3; do
            echo ""
            echo "===== world 第 $attempt 轮（make -j$(nproc)）====="
            if make -j$(nproc) 2>&1 | tee -a build.log; then ok=1; break; fi
            echo "::warning::第 $attempt 轮并行编译失败，按失败包取详细日志"
            grep -nE 'Error [0-9]+|error:|No rule to make target|failed to build' build.log | tail -40 || true
            # 保留 " [host]" / " [variant]" 后缀：gettext-full 这类包失败时是
            #   ERROR: package/libs/gettext-full [host] failed to build.
            # 旧写法按第一个词取，整条匹配不上会误判成"没识别出失败包"
            mapfile -t fails < <(grep -oE '(package|feeds|tools|toolchain|target)/[A-Za-z0-9_./-]+( \[[a-zA-Z0-9_]+\])? failed to build' build.log \
                                   | sed 's/ failed to build$//' | sort -u)
            if [ "${#fails[@]}" -eq 0 ]; then
              echo "::error::日志里没识别出失败包"; tail -80 build.log || true; exit 1
            fi
            echo "失败包：${fails[*]}"
            die=0
            for pkg in "${fails[@]}"; do
              # target/linux 的失败点是镜像生成（target/linux/install），
              # 重跑 compile 只会再编译一遍内核，永远看不到真正报错
              case "$pkg" in
                target/linux) tgt="target/install" ;;
                *" [host]")   tgt="${pkg% \[host\]}/host/compile" ;;
                *" ["*)       tgt="${pkg% \[*}/compile" ;;
                *)            tgt="$pkg/compile" ;;
              esac
              echo ""
              echo "===== 详细错误（make -j1 V=s $tgt）====="
              dlog="detail-$(echo "$tgt" | tr '/' '_').log"
              if timeout 3600 make -j1 V=s "$tgt" 2>&1 | tee "$dlog" | tail -300; then
                echo "::warning::$tgt 单线程重跑成功（并行竞态），继续后续编译"
              else
                # 内核模块包（mtd-rw / quectel_MHI 等）的 build 依赖 $(LINUX_DIR)/.config。
                # 若重跑报 "No rule to make target '.../.config'"，说明内核构建树在进入
                # package 阶段时已经没有了 .config —— 顶层 make 的工具链版本校验
                #（cmp .ver_check 不一致就 rm -rf build_dir/target-* staging_dir/target-*）
                # 会把它清掉：2026-11-18 Lede-CI 44283493905 的单包重跑日志头几行正是
                # 这个 cmp 失败 + rm -rf + "+ mkdir -p staging_dir/..."，紧接着就是
                # .config 缺失。这种状态单包重跑不可能成功，必须先把内核树重建出来。
                if grep -qE "No rule to make target .*\.config'" "$dlog"; then
                  {
                    echo "build_dir/target-*:"; ls -ld build_dir/target-* 2>&1 | head -5
                    echo "linux 目录:"; ls -ld build_dir/target-*/linux-* 2>&1 | head -10
                    echo "linux-*/.config:"; ls -l build_dir/target-*/linux-*/linux-*/.config 2>&1 | head -10
                  } > tree-state.log 2>&1
                  tree_detail=$(sed -e 's/%/%25/g' -e 's/\r//g' -e 's/$/%0A/' tree-state.log | tr -d '\n')
                  echo "::error title=内核构建树现场 $tgt::$tree_detail"
                  echo "::warning::$tgt 缺内核 .config，重建 target/linux 后再重试一次"
                  make -j$(nproc) target/linux/clean > kern-repair.log 2>&1 || true
                  if timeout 3000 make -j$(nproc) target/linux/compile >> kern-repair.log 2>&1; then
                    echo "内核树重建完成，重试 $tgt"
                    if timeout 3600 make -j1 V=s "$tgt" 2>&1 | tee "$dlog.repair" | tail -100; then
                      echo "::warning::$tgt 内核树重建后单包重跑成功，继续后续编译"
                      continue
                    fi
                    echo "::error::$tgt 内核树重建后仍失败"
                    tail -40 "$dlog.repair" || true
                  else
                    echo "::error::target/linux 重建失败"
                    tail -40 kern-repair.log || true
                  fi
                  die=1
                fi
                echo "::error::$tgt 单线程重跑仍失败"
                # 日志要登录才能看，annotation 匿名可读（actions/jobs/<id>/logs 返回
                # 403 "Must have admin rights"，check-runs/<id>/annotations 则公开）。
                # 所以把真实 error 行也塞进 annotation，外面不登录就知道错在哪。
                detail=$(grep -E 'error:|Error [0-9]+|\*\*\* \[' "$dlog" | tail -15 \
                         | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/$/%0A/' | tr -d '\n')
                [ -n "$detail" ] || detail=$(tail -15 "$dlog" \
                         | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/$/%0A/' | tr -d '\n')
                echo "::error title=真实报错 $tgt::$detail"
                die=1
              fi
            done
            [ "$die" = 1 ] && exit 1
          done
          [ "$ok" = 1 ] || { echo "::error::编译 3 轮后仍未成功"; exit 1; }
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/
          # 固件名统一为 lede- 前缀（树内产物默认 openwrt-），并同步校验文件里的文件名
          shopt -s nullglob
          renamed=0
          for f in ./bin/targets/*/*/openwrt-*; do
            d=$(dirname "$f"); b=$(basename "$f")
            mv -f "$f" "$d/lede-${b#openwrt-}"
            renamed=$((renamed+1))
          done
          for t in ./bin/targets/*/*/sha256sums ./bin/targets/*/*/profiles.json; do
            [ -f "$t" ] && sed -i -E 's/(^|[[:space:]"*])openwrt-/\1lede-/g' "$t"
          done
          echo "已把 $renamed 个产物改名为 lede- 前缀"

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: Lede_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Lede_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Lede_firmware
          path: ./bin/targets/

