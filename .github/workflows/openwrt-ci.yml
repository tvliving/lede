name: Lede-CI

on:
  schedule:
    - cron: 0 20 * * *

permissions:
  contents: read

jobs:

  build_openwrt:

    name: Build Lede Firmware

    runs-on: ubuntu-22.04

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout Lede
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Update feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 安装 iStore 软件中心与首页包（树内 vendor）
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/kiddin9/op-packages.git /tmp/kiddin9-store
          (cd /tmp/kiddin9-store && git sparse-checkout set luci-app-store luci-app-quickstart quickstart taskd luci-lib-taskd luci-lib-xterm)
          cp -a /tmp/kiddin9-store/luci-app-store /tmp/kiddin9-store/luci-app-quickstart \
                /tmp/kiddin9-store/quickstart /tmp/kiddin9-store/taskd \
                /tmp/kiddin9-store/luci-lib-taskd /tmp/kiddin9-store/luci-lib-xterm package/
          for p in luci-app-store luci-app-quickstart quickstart taskd luci-lib-taskd luci-lib-xterm; do
            test -f "package/$p/Makefile" || { echo "::error::iStore 包缺失: $p"; exit 1; }
          done
          echo "✔ iStore 软件中心(luci-app-store) + 首页(luci-app-quickstart) 包就绪"

      #===============================================================================
      # 闪存验证（与 tvliving/Kwrt 同一套判定）：仅给 ≥128M 闪存（或 eMMC/SD 启动）
      # 的机型注入 iStore；rootfs 分区装不下 iStore(~15MB) 的机型保持原样编译。
      #===============================================================================
      - name: 闪存验证并注入 iStore（仅 ≥128M 闪存机型）
        run: |
          python3 - <<'PYEOF'
          import re, sys
          # 排除：闪存 <128M 或 rootfs 分区装不下 iStore 的机型（实测/官方 dts 判定）
          EXCLUDE = {
            'cetron_ct3003':                  'ubi 32M',
            'cmcc_a10':                       'ubi 64M（a10-mod 才是 256M 版）',
            'cudy_tr3000-v1':                 'ubi 64M（256mb/mod 版本已单独列出）',
            'h3c_magic-nx30-pro':             '128M flash 但 rootfs 分区 64M',
            'nokia_ea0326gmp':                'ubi 86M',
            'tenbay_wr3000k':                 'ubi 48M x2（双系统分区）',
            'mediatek_mt7986a-rfb':           'IMAGE_SIZE 64M',
            'mediatek_mt7986b-rfb':           'IMAGE_SIZE 64M',
            'ruijie_rg-x60-pro':              'ubi 63M',
            'xiaomi_redmi-router-ax6000-stock':'原厂分区布局 ubi 80M',
          }
          INCLUDE = """airpi_ap3000m abt_asr3000 cetron_ct3003-mod cmcc_a10-mod cmcc_rax3000m-emmc
            cmcc_rax3000m-nand cmcc_rax3000me-emmc cmcc_rax3000me-nand cmcc_xr30-emmc cmcc_xr30-nand
            cudy_tr3000-256mb-v1 cudy_tr3000-mod fzs_5gcpe-p3 glinet_gl-mt2500 glinet_gl-mt3000
            glinet_gl-x3000 glinet_gl-xe3000 huasifei_wh3000-emmc huasifei_wh3000-pro huasifei_ws3006
            huasifei_ws3009 imou_lc-hx3001 jcg_q30-pro konka_komi-a31 openembed_som7981 qihoo_360t7
            xiaomi_mi-router-ax3000t xiaomi_mi-router-wr30u
            asus_tuf-ax4200 asus_tuf-ax6000 bananapi_bpi-r3 bananapi_bpi-r3-mini-emmc bananapi_bpi-r3-mini-nand
            clx_s20l glinet_gl-mt6000 hf_m7986r1-emmc hf_m7986r1-nand jdcloud_re-cs-05 netcore_n60
            netcore_n60-pro tplink_tl-xdr4288 tplink_tl-xdr6086 tplink_tl-xdr6088 tplink_tl-xtr8488
            xiaomi_redmi-router-ax6000
            bananapi_bpi-r4 bananapi_bpi-r4-poe bananapi_bpi-r4-lite glinet_gl-mt3600be mediatek_mt7988a-rfb
            tenda_be12-pro tplink_tl-7dr7299-v1""".split()
          path = 'target/linux/mediatek/image/filogic.mk'
          s = open(path, encoding='utf-8').read()
          miss, done = [], []
          for d in INCLUDE:
              if d in EXCLUDE:
                  continue
              m = re.search(r'(define Device/%s\n.*?\n)(\s*endef)' % re.escape(d), s, re.S)
              if not m:
                  miss.append(d); continue
              if 'luci-app-store' in m.group(1):
                  done.append(d); continue
              s = s[:m.start(2)] + '  DEVICE_PACKAGES += luci-app-store luci-app-quickstart\n' + s[m.start(2):]
              done.append(d)
          open(path, 'w', encoding='utf-8', newline='\n').write(s)
          if miss:
              print('::error::filogic.mk 中找不到这些机型（命名变更？）: %s' % ' '.join(miss)); sys.exit(1)
          print('已注入 %d 台 ≥128M 机型' % len(done))
          print('已排除（<128M 或 rootfs 装不下）:', ' '.join(sorted(EXCLUDE)))
          PYEOF

      - name: Generate configuration file
        run: make defconfig

      - name: Download packages
        run: make download -j16

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/
          # 固件名统一为 lede- 前缀（树内产物默认 openwrt-），并同步校验文件里的文件名
          shopt -s nullglob
          renamed=0
          for f in ./bin/targets/*/*/openwrt-*; do
            d=$(dirname "$f"); b=$(basename "$f")
            mv -f "$f" "$d/lede-${b#openwrt-}"
            renamed=$((renamed+1))
          done
          for t in ./bin/targets/*/*/sha256sums ./bin/targets/*/*/profiles.json; do
            [ -f "$t" ] && sed -i -E 's/(^|[[:space:]"*])openwrt-/\1lede-/g' "$t"
          done
          echo "已把 $renamed 个产物改名为 lede- 前缀"

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: Lede_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Lede_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Lede_firmware
          path: ./bin/targets/
